# Lance l'API dans un conteneur, depuis la racine du projet :
#   docker compose up --build        puis http://127.0.0.1:8000/docs
# Prérequis : un fichier .env (copie de .env.example) avec MISTRAL_API_KEY.
services:
  api:
    build: .
    image: puls-events-api
    ports:
      - "8000:8000"
    env_file: .env                  # MISTRAL_API_KEY, REBUILD_TOKEN : fournis au lancement, jamais dans l'image
    volumes:
      - index:/app/vectorstore      # l'index (téléchargé ou construit au premier démarrage) survit au conteneur
    restart: unless-stopped

volumes:
  index:
